[pytest]
pythonpath = .
testpaths  = tests/backend tests/tests_backend tests/tests_ui tests/tests_devto tests/tests_hashnode tests/tests_medium
addopts    = -m "not integration and not browser and not visual and not breaking"
markers =
    integration: end-to-end tests that require live external services (Medium session)
    browser: Playwright browser tests that require a live server on port 8000
    visual: screenshot-only tests for human visual inspection (require live server)
    breaking: negative/unexpected click-path tests that assert no hard crash (require live server)
