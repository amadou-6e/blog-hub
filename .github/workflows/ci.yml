name: CI

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop
      - "feat/**"
      - "fix/**"
      - "docs/**"
      - "refactor/**"
      - "test/**"
      - "chore/**"
      - "hotfix/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit test gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      BLOGHUB_DB_PATH: ":memory:"
      BLOGHUB_BLOBS_DIR: ${{ runner.temp }}/bloghub-blobs
      BLOGHUB_CREDENTIAL_KEY_FILE: ${{ runner.temp }}/bloghub-credential-keys.json
      DEVTO_API_KEY: ""
      HASHNODE_PAT: ""
      HASHNODE_PUBLICATION_ID: ""
      MEDIUM_CLIENT_ID: ""
      MEDIUM_CLIENT_SECRET: ""
      MEDIUM_SESSION_FILE: ""
      MEDIUM_TOKEN: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            backend/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r backend/requirements.txt

      - name: Run unit tests
        run: bash scripts/run-unit-tests.sh

  contract-checks:
    name: Contract checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Validate generated contracts
        run: npm run check:contracts

  playwright-tests:
    name: Playwright gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      BLOGHUB_DB_PATH: ":memory:"
      BLOGHUB_BLOBS_DIR: ${{ runner.temp }}/bloghub-blobs
      BLOGHUB_CREDENTIAL_KEY_FILE: ${{ runner.temp }}/bloghub-credential-keys.json
      BLOGHUB_DISABLE_AUTH: "true"
      DEVTO_API_KEY: ""
      HASHNODE_PAT: ""
      HASHNODE_PUBLICATION_ID: ""
      MEDIUM_CLIENT_ID: ""
      MEDIUM_CLIENT_SECRET: ""
      MEDIUM_SESSION_FILE: ""
      MEDIUM_TOKEN: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            backend/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r backend/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:playwright:ci

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/results
          if-no-files-found: ignore
