<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BlogHub — Overview v3</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            surface:     '#0f1117',
            panel:       '#181c27',
            border:      '#252a38',
            'border-hi': '#3a3f52',
            muted:       '#5a6080',
            text:        '#c9cfe0',
            bright:      '#e8eaf2',
            accent:      '#6366f1',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body { background: #0f1117; color: #c9cfe0; margin: 0; }

    /* Shimmer */
    @keyframes shimmer {
      0%   { background-position: -600px 0; }
      100% { background-position:  600px 0; }
    }
    .shimmer {
      background: linear-gradient(90deg, #1a1f2e 25%, #21273d 50%, #1a1f2e 75%);
      background-size: 1200px 100%;
      animation: shimmer 1.8s infinite linear;
      border-radius: 4px;
    }

    /* Card */
    .article-card {
      background: #181c27;
      border: 1px solid #252a38;
      border-radius: 8px;
      cursor: pointer;
      transition: border-color 120ms, background 120ms;
      display: flex;
      overflow: hidden;
      min-height: 148px;
      width: 100%;
      max-width: 1080px;
    }
    .article-card:hover  { border-color: #3a3f52; background: #1b2030; }
    .article-card.selected { border-color: #6366f1; background: #1a1f30; }

    .accent-bar { width: 3px; flex-shrink: 0; }

    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

    /* Filter pills */
    .pill-filter {
      font-size: 12px; padding: 4px 10px; border-radius: 6px;
      cursor: pointer; transition: background 100ms, color 100ms;
      color: #5a6080; background: transparent; border: none; font-family: inherit;
    }
    .pill-filter:hover  { color: #c9cfe0; }
    .pill-filter.active { color: #e8eaf2; background: #252a38; font-weight: 500; }

    .pill-platform {
      font-size: 12px; padding: 4px 10px; border-radius: 6px;
      cursor: pointer; border: 1px solid #252a38;
      background: transparent; color: #5a6080; font-family: inherit;
      transition: border-color 100ms, color 100ms, background 100ms;
    }
    .pill-platform:hover  { color: #c9cfe0; border-color: #3a3f52; }
    .pill-platform.active { color: #e8eaf2; background: #1e2230; border-color: #3a3f52; }

    /* Side panel */
    #side-panel {
      flex-shrink: 0;
      display: flex;
      flex-direction: row;
      overflow: hidden;
      background: #13172a;
      transition: width 140ms ease, flex-basis 140ms ease, opacity 140ms ease;
    }
    #side-panel.hidden {
      width: 0;
      flex-basis: 0;
      opacity: 0;
      pointer-events: none;
    }
    #side-strip {
      width: 12px;
      flex-shrink: 0;
      border-left: 1px solid #252a38;
      border-right: 1px solid #252a38;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: #13172a;
      transition: background 100ms;
    }
    #side-strip:hover { background: #181d31; }
    #panel-content {
      width: 288px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #13172a;
    }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #252a38; border-radius: 3px; }

    /* Context menu */
    .ctx-menu {
      position: absolute; top: 100%; right: 0;
      background: #1e2335; border: 1px solid #3a3f52;
      border-radius: 6px; padding: 4px; z-index: 50;
      min-width: 140px; box-shadow: 0 8px 24px #00000060;
    }
    .ctx-item {
      display: block; width: 100%; text-align: left;
      padding: 6px 10px; font-size: 12px; border-radius: 4px;
      color: #c9cfe0; background: transparent; border: none;
      cursor: pointer; font-family: inherit;
    }
    .ctx-item:hover { background: #252a38; }
    .ctx-item.danger { color: #f87171; }
    .ctx-item.danger:hover { background: #2d1a1a; }

    /* Platform tab in preview pane */
    .plat-tab {
      display: flex; align-items: center; gap: 5px;
      padding: 4px 8px 4px 6px;
      border-radius: 4px; cursor: pointer;
      font-size: 10px; font-weight: 600;
      text-transform: uppercase; letter-spacing: .07em;
      color: #5a6080; background: transparent; border: none;
      font-family: inherit;
      transition: color 100ms, background 100ms;
      flex-shrink: 0;
    }
    .plat-tab:hover { color: #c9cfe0; }
    .plat-tab.active { color: #e8eaf2; background: #1e2438; }

    .act {
      flex-shrink: 0; width: 76px; text-align: center;
      font-size: 11px; font-weight: 500; padding: 4px 0;
      border-radius: 5px; border: 1px solid transparent;
      cursor: pointer; font-family: inherit; white-space: nowrap;
    }
    .act:disabled { cursor: default; opacity: 0.6; }

    .preview-frame {
      position: relative;
      height: 100%;
      aspect-ratio: 1200 / 630;
      max-width: 100%;
      margin-left: auto;
      border: 1px solid #252a38;
      border-radius: 8px;
      overflow: hidden;
      background: #10131c;
    }
  </style>
</head>
<body class="font-sans" style="height:100vh;display:flex;flex-direction:column;overflow:hidden;">

<!-- -------------------------------------------
     ZONE A: Top nav
------------------------------------------------ -->
<nav style="height:48px;background:#0f1117;border-bottom:1px solid #252a38;flex-shrink:0;display:flex;align-items:center;padding:0 32px;z-index:40;">
  <!-- Logo — left, flex:1 so it doesn't shrink into tabs -->

    <div style="width:22px;height:22px;border-radius:5px;background:#6366f1;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
        <path d="M2 2h8M2 6h5M2 10h7" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </div>
    <span style="color:#e8eaf2;font-weight:600;font-size:14px;letter-spacing:-0.02em;white-space:nowrap;">BlogHub</span>

  <!-- Nav tabs — center, no grow so logo and actions stay in their own lanes -->
  <div style="display:flex;align-items:stretch;height:48px;flex-shrink:0;">
    <button onclick="setView('articles')"  id="nav-articles"  class="nav-tab" style="padding:0 14px;font-size:13px;border:none;cursor:pointer;font-family:inherit;background:transparent;border-bottom:2px solid #6366f1;color:#e8eaf2;font-weight:500;">Articles</button>
    <button onclick="setView('queue')"     id="nav-queue"     class="nav-tab" style="padding:0 14px;font-size:13px;border:none;cursor:pointer;font-family:inherit;background:transparent;border-bottom:2px solid transparent;color:#5a6080;">Queue</button>
    <button onclick="window.location.href='../settings/v2.html'" id="nav-settings" class="nav-tab" style="padding:0 14px;font-size:13px;border:none;cursor:pointer;font-family:inherit;background:transparent;border-bottom:2px solid transparent;color:#5a6080;">Settings</button>

  <!-- Right actions — flex:1 justify-end keeps it in its own lane -->

        </button>
        <button onclick="window.location.href='../import-article/v1.html?mode=upload&returnTo=overview'"
          style="display:flex;align-items:center;gap:9px;width:100%;padding:8px 12px;font-size:13px;color:#c9cfe0;background:transparent;border:none;cursor:pointer;font-family:inherit;border-radius:5px;text-align:left;transition:background 80ms;"
          onmouseover="this.style.background='#252a38'" onmouseout="this.style.background='transparent'">
          <div style="width:26px;height:26px;border-radius:5px;background:#1e2028;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#c9cfe0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          </div>
          <div><div>Upload .md file</div><div style="font-size:11px;color:#5a6080;margin-top:1px;">Use an existing markdown document</div></div>

</nav>

<!-- Body -->
<div style="flex:1;display:flex;overflow:hidden;">

  <!-- Left: filter bar + grid -->
  <div style="flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;">

    <!-- -------------------------------------------
         ZONE B: Filter bar (two-row)
    ------------------------------------------------ -->
    <div id="filterbar" style="flex-shrink:0;border-bottom:1px solid #252a38;background:#0f1117;padding:18px 32px 8px;">
      <div style="display:flex;align-items:center;gap:8px;">

          <input id="search-input" type="text" placeholder="Search articles…" oninput="applyFilters()"

            onfocus="this.style.borderColor='#6366f1'" onblur="this.style.borderColor='#252a38'" />

          <button class="pill-filter active" id="sf-all"       onclick="setStatusFilter('all',this)">All</button>
          <button class="pill-filter"        id="sf-drafting"  onclick="setStatusFilter('drafting',this)">Drafting</button>

<script>
// --- Data ----------------------------------------------------------
let ARTICLES = [];

// --- Per-platform thumbnail palette --------------------------------
// Each entry: { heading, para, codeBlock, codeLine1, codeLine2, codeLine3, codeLine4, imagePlaceholder, fade }
const PLATFORM_PALETTE = {
  medium: {
    heading:     '#c9a96e',   // warm amber
    para:        '#1e2438',
    codeBlock:   '#0f1117',
    codeLine1:   '#c9a96e33',
    codeLine2:   '#d4a05422',
    codeLine3:   '#c9a96e33',
    codeLine4:   '#b8924033',
    imageBg:     '#1a1e2a',
    imageStroke: '#4a4035',
    fade:        '#181c27',
  },
  hashnode: {
    heading:     '#60a5fa',   // blue
    para:        '#1e2a3e',
    codeBlock:   '#090e1a',
    codeLine1:   '#60a5fa33',
    codeLine2:   '#3b82f622',
    codeLine3:   '#60a5fa33',
    codeLine4:   '#818cf822',
    imageBg:     '#111827',
    imageStroke: '#2d4a7a',
    fade:        '#181c27',
  },
  devto: {
    heading:     '#4ade80',   // green
    para:        '#1e2438',
    codeBlock:   '#0f1117',
    codeLine1:   '#4ade8033',
    codeLine2:   '#34d39922',
    codeLine3:   '#4ade8033',
    codeLine4:   '#86efac22',
    imageBg:     '#1a1e2a',
    imageStroke: '#2a4a35',
    fade:        '#181c27',
  },
};

const PLATFORM_LABEL = { medium: 'Medium', hashnode: 'Hashnode', devto: 'Dev.to' };

// --- State ---------------------------------------------------------
let selectedId     = null;
let statusFilter   = 'all';
let platformFilter = new Set();
let showSkeleton   = false;
let showEmpty      = false;
let openMenuId     = null;
let detailsPanelOpen = true;
// Per-card active preview platform: Map<articleId, 'medium'|'hashnode'|'devto'>
const activePreview = new Map();

// --- Helpers -------------------------------------------------------
const DOT_COLOR = {
  draft: '#6ea8fe', ready: '#4ade80', published: '#38bdf8',
  pending: '#fbbf24', error: '#f87171', none: '#252a38', review: '#fbbf24',
};
const GATE_COLOR = { pass: '#4ade80', warn: '#fbbf24', fail: '#f87171', pending: '#5a6080' };
const GATE_LABEL = { pass: '✓ Pass', warn: '⚠ Warn', fail: '✗ Fail', pending: '—' };
const activeJobs = new Map();

function formatRelative(isoValue) {
  const date = new Date(isoValue);
  if (Number.isNaN(date.getTime())) return String(isoValue || '');
  const diffMs = Date.now() - date.getTime();
  const diffHours = Math.floor(diffMs / 3600000);
  if (diffHours < 1) return `${Math.max(1, Math.floor(diffMs / 60000))}m ago`;
  if (diffHours < 24) return `${diffHours}h ago`;
  const diffDays = Math.floor(diffHours / 24);
  if (diffDays < 7) return `${diffDays}d ago`;
  return `${Math.floor(diffDays / 7)}w ago`;
}

function formatTimelineTime(isoValue) {
  const date = new Date(isoValue);
  if (Number.isNaN(date.getTime())) return String(isoValue || '');
  return date.toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function chooseAction(article) {
  const destinations = Object.values(article.destinations);
  const links = destinations.map(d => d.url).filter(Boolean);
  if (article.gate === 'fail' || destinations.some(d => d.status === 'error')) {
    return { kind: 'inspect', label: 'Inspect →', color: '#f87171', bg: '#2d1a1a', border: '#4d2a2a' };
  }
  if (destinations.every(d => d.status === 'published' || d.status === 'none') && links.length > 0) {
    return { kind: 'open', label: 'View live ↗', color: '#38bdf8', bg: '#0d2830', border: '#1a3d4a', url: links[0] };
  }
  if (destinations.some(d => d.status === 'ready')) {
    return { kind: 'schedule', label: 'Schedule →', color: '#fff', bg: '#6366f1', border: '#6366f1' };
  }
  return { kind: 'push', label: 'Push drafts →', color: '#fff', bg: '#6366f1', border: '#6366f1' };
}

function preferredLiveUrl(article, platform) {
  const preferredDestination = article.destinations[platform];
  if (preferredDestination && preferredDestination.url) return preferredDestination.url;
  for (const status of ['published', 'draft', 'ready', 'review', 'pending']) {
    for (const name of ['medium', 'hashnode', 'devto']) {
      const destination = article.destinations[name];
      if (destination && destination.status === status && destination.url) {
        return destination.url;
      }
    }
  }
  return null;
}

function buildLiveArticle(raw, index) {
  return {
    id: raw.id,
    urgency: index + 1,
    title: raw.title,
    updated: formatRelative(raw.updatedAt),
    words: raw.wordCount,
    previewImageUrl: raw.previewImageUrl || null,
    source: raw.source || 'native',
    sourcePlatform: raw.sourcePlatform || null,
    destinations: {
      medium: raw.destinations.medium,
      hashnode: raw.destinations.hashnode,
      devto: raw.destinations.devto,
    },
    gate: raw.gate,
    action: chooseAction(raw),
    timeline: (raw.recentTimeline || []).map(item => ({
      time: formatTimelineTime(item.timestamp),
      event: item.event,
    })),
  };
}

async function fetchJson(url, options = {}) {
  const response = await fetch(url, options);
  if (!response.ok) {
    throw new Error(await response.text() || `Request failed: ${response.status}`);
  }
  return response.json();
}

async function loadOverview() {
  const [articlesPayload, connectionsPayload] = await Promise.all([
    fetchJson('/api/articles?sortBy=updatedAt&sortDir=desc&page=1&pageSize=100'),
    fetchJson('/api/connections'),
  ]);
  ARTICLES = articlesPayload.items.map(buildLiveArticle);
  const connected = connectionsPayload.connections.filter(
    item => ['medium', 'hashnode', 'devto'].includes(item.id) && item.status === 'connected'
  );
  document.getElementById('connected-count').innerHTML = `
    <span style="width:6px;height:6px;border-radius:50%;background:#4ade80;display:inline-block;"></span>
    ${connected.length} platforms connected
  `;
}

async function runArticleAction(article, overrideKind = null) {
  const action = overrideKind ? { ...article.action, kind: overrideKind } : article.action;
  if (action.kind === 'open' && action.url) {
    window.open(action.url, '_blank', 'noopener,noreferrer');
    return;
  }
  if (action.kind === 'schedule') {
    alert('Schedule is not wired yet.');
    return;
  }
  const endpoint = action.kind === 'inspect' ? 'inspect' : 'push';
  activeJobs.set(article.id, endpoint);
  render();
  try {
    const accepted = await fetchJson(`/api/articles/${article.id}/${endpoint}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({}),
    });
    await pollJob(accepted.jobId);
    await loadOverview();
  } catch (error) {
    alert(`Action failed: ${error.message}`);
  } finally {
    activeJobs.delete(article.id);
    render();
  }
}

async function pollJob(jobId) {
  for (let attempt = 0; attempt < 10; attempt += 1) {
    const job = await fetchJson(`/api/jobs/${jobId}`);
    if (job.status === 'done') return job;
    if (job.status === 'error') throw new Error(job.error || 'Job failed');
    await new Promise(resolve => window.setTimeout(resolve, 500));
  }
  throw new Error('Timed out waiting for job completion');
}

function platformActionProps(status) {
  switch (status) {
    case 'draft': case 'review':
      return { label: 'Publish',    bg: '#0e2d22',    border: '#1a4d35', color: '#4ade80', disabled: false };
    case 'ready':
      return { label: 'Schedule',   bg: 'transparent', border: '#4a5068', color: '#8a93b0', disabled: false };
    case 'published':
      return { label: 'View ↗',     bg: 'transparent', border: '#4a5068', color: '#8a93b0', disabled: false };
    case 'pending':
      return { label: 'Pending',    bg: '#1a1600',    border: '#3a3010', color: '#5a6080', disabled: true };
    case 'error':
      return { label: 'Retry',      bg: '#1e1818',    border: '#3a2828', color: '#c07070', disabled: false };
    default:
      return { label: 'Push draft', bg: 'transparent', border: '#4a5068', color: '#8a93b0', disabled: false };
  }
}

function accentForArticle(a) {
  if (a.gate === 'fail') return '#f87171';
  if (a.gate === 'warn') return '#fbbf24';
  if (Object.values(a.destinations).every(d => d.status === 'published')) return '#38bdf8';
  return '#6366f1';
}

function defaultPreviewPlatform(a) {
  // Pick first platform that has a real status
  for (const p of ['medium', 'hashnode', 'devto']) {
    if (a.destinations[p].status !== 'none') return p;
  }
  return 'medium';
}

function matchesFilters(a) {
  const q = document.getElementById('search-input').value.toLowerCase();
  if (q && !a.title.toLowerCase().includes(q)) return false;
  if (statusFilter !== 'all') {
    const statuses = Object.values(a.destinations).map(d => d.status);
    if (statusFilter === 'error'     && !statuses.includes('error'))     return false;
    if (statusFilter === 'ready'     && !statuses.includes('ready'))     return false;
    if (statusFilter === 'published' && !statuses.every(d => d === 'published')) return false;
    if (statusFilter === 'drafting'  && !statuses.some(d => ['draft','pending','review'].includes(d))) return false;
  }
  if (platformFilter.size > 0) {
    const hasPlatform = [...platformFilter].some(p => a.destinations[p] && a.destinations[p].status !== 'none');
    if (!hasPlatform) return false;
  }
  return true;
}

// --- Render --------------------------------------------------------
function render() {
  const grid    = document.getElementById('card-grid');
  const emptyEl = document.getElementById('empty-state');
  const noRes   = document.getElementById('no-results');
  grid.innerHTML = '';
  emptyEl.style.display = 'none';
  noRes.style.display   = 'none';

  if (showEmpty)    { emptyEl.style.display = 'flex'; document.getElementById('article-count').textContent = '0 articles'; syncDetailsPanel(); return; }
  if (showSkeleton) {
    for (let i = 0; i < 5; i++) grid.appendChild(renderSkeleton());
    document.getElementById('article-count').textContent = '— articles';
    syncDetailsPanel();
    return;
  }

  const filtered = ARTICLES.filter(matchesFilters).sort((a, b) => a.urgency - b.urgency);
  document.getElementById('article-count').textContent = `${filtered.length} article${filtered.length !== 1 ? 's' : ''}`;

  if (filtered.length === 0) { noRes.style.display = 'flex'; syncDetailsPanel(); return; }
  filtered.forEach(a => grid.appendChild(renderCard(a)));
  syncDetailsPanel();
}

function syncDetailsPanel() {
  const panel = document.getElementById('side-panel');
  const content = document.getElementById('panel-content');
  const arrow = document.getElementById('side-strip-arrow');
  if (!selectedId) {
    panel.classList.add('hidden');
    return;
  }

  panel.classList.remove('hidden');
  if (detailsPanelOpen) {
    panel.style.width = '300px';
    panel.style.flexBasis = '300px';
    content.style.display = 'flex';
    arrow.innerHTML = '<polyline points="9 18 15 12 9 6"/>';
  } else {
    panel.style.width = '12px';
    panel.style.flexBasis = '12px';
    content.style.display = 'none';
    arrow.innerHTML = '<polyline points="15 18 9 12 15 6"/>';
  }
}

// --- Interactions --------------------------------------------------
function selectCard(id) {
  closeMenus();
  if (id === selectedId) {
    detailsPanelOpen = !detailsPanelOpen;
    syncDetailsPanel();
    return;
  }
  selectedId = id;
  render();
  detailsPanelOpen = true;
  syncDetailsPanel();
  const a = ARTICLES.find(x => x.id === selectedId);
  document.getElementById('panel-title').textContent = a.title;
  document.getElementById('panel-destinations').innerHTML = ['medium','hashnode','devto'].map(p => {
    const d = a.destinations[p];
    return `<div style="display:flex;align-items:center;justify-content:space-between;">
      <span style="color:#c9cfe0;font-size:12px;">${PLATFORM_LABEL[p]}</span>
      <div style="display:flex;align-items:center;gap:6px;">
        <span style="width:7px;height:7px;border-radius:50%;background:${DOT_COLOR[d.status]||'#252a38'};display:inline-block;"></span>
        <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:${DOT_COLOR[d.status]||'#5a6080'}">${d.label}</span>
      </div>
    </div>`;
  }).join('');
  document.getElementById('panel-timeline').innerHTML = a.timeline.map(t =>
    `<div style="display:flex;gap:8px;">
      <span style="color:#5a6080;font-family:'JetBrains Mono',monospace;font-size:10px;width:48px;flex-shrink:0;padding-top:1px;">${t.time}</span>
      <span style="color:#c9cfe0;font-size:12px;line-height:1.5;">${t.event}</span>
    </div>`
  ).join('');
  const pb = document.getElementById('panel-primary-btn');
  pb.textContent = a.action.label;
  pb.style.background = a.action.bg;
  pb.style.color = a.action.color;
  pb.style.border = `1px solid ${a.action.border}`;
  pb.onclick = async () => { await runArticleAction(a); };
  document.getElementById('panel-inspect-btn').onclick = async () => { await runArticleAction(a, 'inspect'); };
}

function toggleDetailsPanel() {
  if (!selectedId) return;
  detailsPanelOpen = !detailsPanelOpen;
  syncDetailsPanel();
}

function closePanel() {
  selectedId = null;
  detailsPanelOpen = true;
  render();
  syncDetailsPanel();
}

function setStatusFilter(val, el) {
  statusFilter = val;
  document.querySelectorAll('.pill-filter').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  applyFilters();
}

function togglePlatform(p, el) {
  platformFilter.has(p) ? platformFilter.delete(p) : platformFilter.add(p);
  el.classList.toggle('active');
  applyFilters();
}

function applyFilters() { render(); }

function clearFilters() {
  document.getElementById('search-input').value = '';
  statusFilter = 'all';
  platformFilter.clear();
  document.querySelectorAll('.pill-filter').forEach(b => b.classList.remove('active'));
  document.getElementById('sf-all').classList.add('active');
  document.querySelectorAll('.pill-platform').forEach(b => b.classList.remove('active'));
  render();
}

function toggleSkeleton() { showSkeleton = !showSkeleton; showEmpty = false; render(); }
function toggleEmpty()    { showEmpty = !showEmpty; showSkeleton = false; render(); }

function toggleImportMenu(e) {
  e.stopPropagation();
  const menu = document.getElementById('import-menu');
  const isOpen = menu.style.display === 'block';
  menu.style.display = isOpen ? 'none' : 'block';
  if (!isOpen) {
    const close = () => { menu.style.display = 'none'; document.removeEventListener('click', close); };
    document.addEventListener('click', close);
  }
}

function setView(v) {
  document.querySelectorAll('.nav-tab').forEach(t => {
    t.style.borderBottomColor = 'transparent';
    t.style.color = '#5a6080';
    t.style.fontWeight = '400';
  });
  const el = document.getElementById('nav-' + v);
  if (el) { el.style.borderBottomColor = '#6366f1'; el.style.color = '#e8eaf2'; el.style.fontWeight = '500'; }
}

function toggleMenu(id, wrap) {
  if (openMenuId === id) { closeMenus(); return; }
  closeMenus();
  openMenuId = id;
  const menu = document.createElement('div');
  menu.className = 'ctx-menu';
  menu.innerHTML = `
    <button class="ctx-item" onclick="alert('Edit ${id}');closeMenus()">Edit</button>
    <button class="ctx-item" onclick="alert('Duplicate ${id}');closeMenus()">Duplicate</button>
    <button class="ctx-item" onclick="alert('Archive ${id}');closeMenus()">Archive</button>
    <button class="ctx-item danger" onclick="alert('Delete ${id}');closeMenus()">Delete</button>`;
  wrap.appendChild(menu);
  setTimeout(() => document.addEventListener('click', closeMenus, { once: true }), 0);
}

function closeMenus() {
  document.querySelectorAll('.ctx-menu').forEach(m => m.remove());
  openMenuId = null;
}

showSkeleton = true;
render();
loadOverview()
  .catch(error => { alert(`Failed to load overview: ${error.message}`); })
  .finally(() => {
    showSkeleton = false;
    render();
  });
</script>
</body>
</html>
