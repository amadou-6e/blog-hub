<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>BlogHub — Overview v3</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            surface:     '#0f1117',
            panel:       '#181c27',
            border:      '#252a38',
            'border-hi': '#3a3f52',
            muted:       '#5a6080',
            text:        '#c9cfe0',
            bright:      '#e8eaf2',
            accent:      '#6366f1',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body { background: #0f1117; color: #c9cfe0; margin: 0; }

    /* Shimmer */
    @keyframes shimmer {
      0%   { background-position: -600px 0; }
      100% { background-position:  600px 0; }
    }
    .shimmer {
      background: linear-gradient(90deg, #1a1f2e 25%, #21273d 50%, #1a1f2e 75%);
      background-size: 1200px 100%;
      animation: shimmer 1.8s infinite linear;
      border-radius: 4px;
    }

    /* Card */
    .article-card {
      background: #181c27;
      border: 1px solid #252a38;
      border-radius: 8px;
      cursor: pointer;
      transition: border-color 120ms, background 120ms;
      display: flex;
      overflow: hidden;
      min-height: 148px;
    }
    .article-card:hover  { border-color: #3a3f52; background: #1b2030; }
    .article-card.selected { border-color: #6366f1; background: #1a1f30; }

    .accent-bar { width: 3px; flex-shrink: 0; }

    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

    /* Filter pills */
    .pill-filter {
      font-size: 12px; padding: 4px 10px; border-radius: 6px;
      cursor: pointer; transition: background 100ms, color 100ms;
      color: #5a6080; background: transparent; border: none; font-family: inherit;
    }
    .pill-filter:hover  { color: #c9cfe0; }
    .pill-filter.active { color: #e8eaf2; background: #252a38; font-weight: 500; }

    .pill-platform {
      font-size: 12px; padding: 4px 10px; border-radius: 6px;
      cursor: pointer; border: 1px solid #252a38;
      background: transparent; color: #5a6080; font-family: inherit;
      transition: border-color 100ms, color 100ms, background 100ms;
    }
    .pill-platform:hover  { color: #c9cfe0; border-color: #3a3f52; }
    .pill-platform.active { color: #e8eaf2; background: #1e2230; border-color: #3a3f52; }

    /* Side panel */
    #side-panel {
      width: 288px; flex-shrink: 0;
      border-left: 1px solid #252a38;
      background: #13172a;
      display: flex; flex-direction: column;
      transition: opacity 160ms, transform 160ms;
    }
    #side-panel.hidden { opacity: 0; pointer-events: none; transform: translateX(16px); }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #252a38; border-radius: 3px; }

    /* Context menu */
    .ctx-menu {
      position: absolute; top: 100%; right: 0;
      background: #1e2335; border: 1px solid #3a3f52;
      border-radius: 6px; padding: 4px; z-index: 50;
      min-width: 140px; box-shadow: 0 8px 24px #00000060;
    }
    .ctx-item {
      display: block; width: 100%; text-align: left;
      padding: 6px 10px; font-size: 12px; border-radius: 4px;
      color: #c9cfe0; background: transparent; border: none;
      cursor: pointer; font-family: inherit;
    }
    .ctx-item:hover { background: #252a38; }
    .ctx-item.danger { color: #f87171; }
    .ctx-item.danger:hover { background: #2d1a1a; }

    /* Platform tab in preview pane */
    .plat-tab {
      display: flex; align-items: center; gap: 5px;
      padding: 4px 8px 4px 6px;
      border-radius: 4px; cursor: pointer;
      font-size: 10px; font-weight: 600;
      text-transform: uppercase; letter-spacing: .07em;
      color: #5a6080; background: transparent; border: none;
      font-family: inherit;
      transition: color 100ms, background 100ms;
      flex-shrink: 0;
    }
    .plat-tab:hover { color: #c9cfe0; }
    .plat-tab.active { color: #e8eaf2; background: #1e2438; }
  </style>
</head>
<body class="font-sans" style="height:100vh;display:flex;flex-direction:column;overflow:hidden;">

<div style="flex:1;display:flex;overflow:hidden;">

  medium: {

};

const PLATFORM_LABEL = { medium: 'Medium', hashnode: 'Hashnode', devto: 'Dev.to' };

// ─── State ─────────────────────────────────────────────────────────
let selectedId     = null;
let statusFilter   = 'all';
let platformFilter = new Set();
let showSkeleton   = false;
let showEmpty      = false;
let openMenuId     = null;
// Per-card active preview platform: Map<articleId, 'medium'|'hashnode'|'devto'>
const activePreview = new Map();

// ─── Helpers ───────────────────────────────────────────────────────
const DOT_COLOR = {
  draft: '#6ea8fe', ready: '#4ade80', published: '#38bdf8',
  pending: '#fbbf24', error: '#f87171', none: '#252a38', review: '#fbbf24',
};
const GATE_COLOR = { pass: '#4ade80', warn: '#fbbf24', fail: '#f87171', pending: '#5a6080' };
const GATE_LABEL = { pass: '✓ Pass', warn: '⚠ Warn', fail: '✗ Fail', pending: '—' };

function accentForArticle(a) {
  if (a.gate === 'fail') return '#f87171';
  if (a.gate === 'warn') return '#fbbf24';
  if (Object.values(a.destinations).every(d => d.status === 'published')) return '#38bdf8';
  return '#6366f1';
}

function defaultPreviewPlatform(a) {
  // Pick first platform that has a real status
  for (const p of ['medium', 'hashnode', 'devto']) {
    if (a.destinations[p].status !== 'none') return p;
  }
  return 'medium';
}

function matchesFilters(a) {
  const q = document.getElementById('search-input').value.toLowerCase();
  if (q && !a.title.toLowerCase().includes(q)) return false;
  if (statusFilter !== 'all') {
    const statuses = Object.values(a.destinations).map(d => d.status);
    if (statusFilter === 'error'     && !statuses.includes('error'))     return false;
    if (statusFilter === 'ready'     && !statuses.includes('ready'))     return false;
    if (statusFilter === 'published' && !statuses.every(d => d === 'published')) return false;
    if (statusFilter === 'drafting'  && !statuses.some(d => ['draft','pending','review'].includes(d))) return false;
  }
  if (platformFilter.size > 0) {
    const hasPlatform = [...platformFilter].some(p => a.destinations[p] && a.destinations[p].status !== 'none');
    if (!hasPlatform) return false;
  }
  return true;
}

// ─── Thumbnail builder ─────────────────────────────────────────────
function buildThumbnail(pal) {
  return `
    <div style="display:flex;flex-direction:column;gap:5px;transform:scale(0.88);transform-origin:left center;">

      <!-- H1 heading line -->
      <div style="height:9px;width:82%;border-radius:3px;background:${pal.heading};opacity:0.55;"></div>

      <!-- Paragraph block 1 -->
      <div style="display:flex;flex-direction:column;gap:3px;margin-top:4px;">
        <div style="height:5px;width:100%;border-radius:2px;background:${pal.para};"></div>
        <div style="height:5px;width:96%;border-radius:2px;background:${pal.para};"></div>
        <div style="height:5px;width:88%;border-radius:2px;background:${pal.para};"></div>
        <div style="height:5px;width:73%;border-radius:2px;background:${pal.para};"></div>
      </div>

      <!-- Code block -->
      <div style="margin-top:5px;border-radius:4px;background:${pal.codeBlock};border:1px solid #252a38;padding:6px 8px;display:flex;flex-direction:column;gap:3px;">
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:2px;">
          <div style="height:3px;width:28px;border-radius:2px;background:#3a3f52;"></div>
          <div style="height:3px;width:16px;border-radius:2px;background:#3a3f52;"></div>
        </div>
        <div style="height:4px;width:90%;border-radius:2px;background:${pal.codeLine1};"></div>
        <div style="height:4px;width:70%;border-radius:2px;background:${pal.codeLine2};"></div>
        <div style="height:4px;width:80%;border-radius:2px;background:${pal.codeLine3};"></div>
        <div style="height:4px;width:55%;border-radius:2px;background:${pal.codeLine4};"></div>
      </div>

      <!-- Paragraph block 2 -->
      <div style="display:flex;flex-direction:column;gap:3px;margin-top:4px;">
        <div style="height:5px;width:100%;border-radius:2px;background:${pal.para};"></div>
        <div style="height:5px;width:94%;border-radius:2px;background:${pal.para};"></div>
        <div style="height:5px;width:60%;border-radius:2px;background:${pal.para};"></div>
      </div>

      <!-- Image placeholder -->
      <div style="margin-top:5px;height:28px;border-radius:4px;background:${pal.imageBg};border:1px solid #252a38;display:flex;align-items:center;justify-content:center;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="${pal.imageStroke}" stroke-width="1.5">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <path d="m21 15-5-5L5 21"/>
        </svg>
      </div>

    </div>
    <!-- fade -->
    <div style="position:absolute;bottom:0;left:0;right:0;height:45%;background:linear-gradient(to bottom,transparent,${pal.fade});pointer-events:none;"></div>
  `;
}

// ─── Card renderer ─────────────────────────────────────────────────
function renderCard(a) {
  const accent = accentForArticle(a);
  const isSelected = selectedId === a.id;
  if (!activePreview.has(a.id)) activePreview.set(a.id, defaultPreviewPlatform(a));
  const activePlat = activePreview.get(a.id);

  const card = document.createElement('div');
  card.className = 'article-card' + (isSelected ? ' selected' : '');
  card.dataset.id = a.id;
  card.onclick = (e) => { if (!e.target.closest('.ctx-trigger') && !e.target.closest('.plat-tab')) selectCard(a.id); };

  // Accent bar
  const bar = document.createElement('div');
  bar.className = 'accent-bar';
  bar.style.background = accent;
  card.appendChild(bar);

  // ── Left metadata pane (fixed 320px) ──
  const left = document.createElement('div');
  left.style.cssText = 'width:320px;flex-shrink:0;padding:14px 16px 12px;display:flex;flex-direction:column;';

  // Title + context menu
  const titleRow = document.createElement('div');
  titleRow.style.cssText = 'display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:3px;';
  const title = document.createElement('span');
  title.style.cssText = 'color:#e8eaf2;font-weight:500;font-size:13px;line-height:1.4;';
  title.textContent = a.title;
  titleRow.appendChild(title);

  const ctxWrap = document.createElement('div');
  ctxWrap.style.cssText = 'position:relative;flex-shrink:0;';
  const ctxBtn = document.createElement('button');
  ctxBtn.className = 'ctx-trigger';
  ctxBtn.style.cssText = 'background:none;border:none;color:#5a6080;cursor:pointer;padding:0 2px;font-size:15px;line-height:1;font-family:inherit;';
  ctxBtn.textContent = '···';
  ctxBtn.onclick = (e) => { e.stopPropagation(); toggleMenu(a.id, ctxWrap); };
  ctxWrap.appendChild(ctxBtn);
  titleRow.appendChild(ctxWrap);
  left.appendChild(titleRow);

  // Meta
  const meta = document.createElement('div');
  meta.style.cssText = 'color:#5a6080;font-family:"JetBrains Mono",monospace;font-size:11px;margin-bottom:10px;';
  meta.textContent = `${a.updated} · ${a.words.toLocaleString()} words`;
  left.appendChild(meta);

  // Divider 1
  const d1 = document.createElement('div');
  d1.style.cssText = 'height:1px;background:#252a38;margin-bottom:10px;';
  left.appendChild(d1);

  // Destination rows
  const dests = document.createElement('div');
  dests.style.cssText = 'display:flex;flex-direction:column;gap:5px;margin-bottom:10px;';
  ['medium', 'hashnode', 'devto'].forEach(p => {
    const d = a.destinations[p];
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;align-items:center;gap:7px;';
    const dot = document.createElement('span');
    dot.className = 'dot';
    dot.style.background = DOT_COLOR[d.status] || '#252a38';
    row.appendChild(dot);
    const pname = document.createElement('span');
    pname.style.cssText = 'color:#5a6080;font-size:12px;width:62px;flex-shrink:0;';
    pname.textContent = PLATFORM_LABEL[p];
    row.appendChild(pname);
    const lbl = document.createElement('span');
    lbl.style.cssText = `color:${DOT_COLOR[d.status] || '#5a6080'};font-family:"JetBrains Mono",monospace;font-size:11px;`;
    lbl.textContent = d.label;
    row.appendChild(lbl);
    dests.appendChild(row);
  });
  left.appendChild(dests);

  // Divider 2
  const d2 = document.createElement('div');
  d2.style.cssText = 'height:1px;background:#252a38;margin-bottom:10px;';
  left.appendChild(d2);

  // Gate + action (push to bottom)
  left.style.cssText += 'justify-content:flex-start;';
  const footer = document.createElement('div');
  footer.style.cssText = 'display:flex;align-items:center;justify-content:space-between;margin-top:auto;';
  const gate = document.createElement('span');
  gate.style.cssText = `color:${GATE_COLOR[a.gate]};font-family:"JetBrains Mono",monospace;font-size:11px;`;
  gate.textContent = GATE_LABEL[a.gate];
  footer.appendChild(gate);
  const btn = document.createElement('button');
  btn.style.cssText = `font-size:11px;font-weight:500;padding:5px 10px;border-radius:5px;background:${a.action.bg};color:${a.action.color};border:1px solid ${a.action.border};cursor:pointer;font-family:inherit;white-space:nowrap;`;
  btn.textContent = a.action.label;
  btn.onclick = (e) => { e.stopPropagation(); alert(`→ action: ${a.action.label} for "${a.title}"`); };
  footer.appendChild(btn);
  left.appendChild(footer);

  card.appendChild(left);

  // ── Vertical divider ──
  const vdiv = document.createElement('div');
  vdiv.style.cssText = 'width:1px;background:#252a38;flex-shrink:0;';
  card.appendChild(vdiv);

  // ── Right preview pane ──
  const right = document.createElement('div');
  right.style.cssText = 'flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden;';

  // Platform tabs row
  const tabRow = document.createElement('div');
  tabRow.style.cssText = 'display:flex;align-items:center;gap:2px;padding:8px 12px 6px;border-bottom:1px solid #252a38;flex-shrink:0;';

  ['medium', 'hashnode', 'devto'].forEach(p => {
    const d = a.destinations[p];
    const isActive = p === activePlat;
    const dotColor = DOT_COLOR[d.status] || '#252a38';

    const tab = document.createElement('button');
    tab.className = 'plat-tab' + (isActive ? ' active' : '');
    tab.onclick = (e) => {
      e.stopPropagation();
      activePreview.set(a.id, p);
      // Update just this card's preview without full re-render
      const previewEl = card.querySelector('.preview-content');
      const pal = PLATFORM_PALETTE[p];
      previewEl.innerHTML = buildThumbnail(pal);
      // Update tabs
      card.querySelectorAll('.plat-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      // Update indicator bars
      card.querySelectorAll('.tab-indicator').forEach((bar, i) => {
        const platforms = ['medium','hashnode','devto'];
        bar.style.opacity = platforms[i] === p ? '1' : '0';
      });
    };

    // Inner layout: dot + blue bar (selection indicator) + label
    tab.innerHTML = `
      <span style="width:6px;height:6px;border-radius:50%;background:${dotColor};flex-shrink:0;"></span>
      <span class="tab-indicator" style="width:2px;height:10px;border-radius:1px;background:#6366f1;flex-shrink:0;margin:0 1px;opacity:${isActive ? 1 : 0};transition:opacity 120ms;"></span>
      <span>${PLATFORM_LABEL[p]}</span>
    `;
    tabRow.appendChild(tab);
  });

  right.appendChild(tabRow);

  // Thumbnail area
  const thumbArea = document.createElement('div');
  thumbArea.style.cssText = 'flex:1;padding:14px 18px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;';
  thumbArea.className = 'preview-content';
  thumbArea.innerHTML = buildThumbnail(PLATFORM_PALETTE[activePlat]);
  right.appendChild(thumbArea);

  card.appendChild(right);
  return card;
}

// ─── Skeleton card ──────────────────────────────────────────────────
function renderSkeleton() {
  const card = document.createElement('div');
  card.style.cssText = 'background:#181c27;border:1px solid #252a38;border-radius:8px;display:flex;overflow:hidden;min-height:148px;';
  card.innerHTML = `
    <div style="width:3px;background:#252a38;flex-shrink:0;"></div>
    <div style="width:320px;flex-shrink:0;padding:14px 16px 12px;display:flex;flex-direction:column;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:3px;">
        <div class="shimmer" style="height:14px;width:75%;"></div>
        <div class="shimmer" style="height:14px;width:16px;margin-left:8px;"></div>
      </div>
      <div class="shimmer" style="height:11px;width:35%;margin-bottom:10px;"></div>
      <div style="height:1px;background:#252a38;margin-bottom:10px;"></div>
      <div style="display:flex;flex-direction:column;gap:5px;margin-bottom:10px;">
        ${['62%','50%','58%'].map(w => `
          <div style="display:flex;align-items:center;gap:7px;">
            <div style="width:8px;height:8px;border-radius:50%;background:#252a38;"></div>
            <div class="shimmer" style="height:11px;width:${w};"></div>
          </div>`).join('')}
      </div>
      <div style="height:1px;background:#252a38;margin-bottom:10px;"></div>
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div class="shimmer" style="height:11px;width:48px;"></div>
        <div class="shimmer" style="height:26px;width:80px;border-radius:5px;"></div>
      </div>
    </div>
    <div style="width:1px;background:#252a38;flex-shrink:0;"></div>
    <div style="flex:1;display:flex;flex-direction:column;">
      <div style="height:36px;border-bottom:1px solid #252a38;padding:8px 12px;display:flex;gap:8px;align-items:center;">
        <div class="shimmer" style="height:10px;width:48px;border-radius:4px;"></div>
        <div class="shimmer" style="height:10px;width:52px;border-radius:4px;"></div>
        <div class="shimmer" style="height:10px;width:40px;border-radius:4px;"></div>
      </div>
      <div style="flex:1;padding:14px 18px;display:flex;flex-direction:column;gap:6px;">
        <div class="shimmer" style="height:9px;width:80%;"></div>
        <div style="display:flex;flex-direction:column;gap:3px;margin-top:4px;">
          <div class="shimmer" style="height:5px;width:100%;"></div>
          <div class="shimmer" style="height:5px;width:90%;"></div>
          <div class="shimmer" style="height:5px;width:75%;"></div>
        </div>
        <div class="shimmer" style="margin-top:4px;height:32px;width:100%;border-radius:4px;"></div>
      </div>
    </div>`;
  return card;
}

// ─── Render ────────────────────────────────────────────────────────
function render() {
  const grid    = document.getElementById('card-grid');
  const emptyEl = document.getElementById('empty-state');
  const noRes   = document.getElementById('no-results');
  grid.innerHTML = '';
  emptyEl.style.display = 'none';
  noRes.style.display   = 'none';

  if (showEmpty)    { emptyEl.style.display = 'flex'; document.getElementById('article-count').textContent = '0 articles'; return; }
  if (showSkeleton) {
    for (let i = 0; i < 5; i++) grid.appendChild(renderSkeleton());
    document.getElementById('article-count').textContent = '— articles';
    return;
  }

  const filtered = ARTICLES.filter(matchesFilters).sort((a, b) => a.urgency - b.urgency);
  document.getElementById('article-count').textContent = `${filtered.length} article${filtered.length !== 1 ? 's' : ''}`;

  if (filtered.length === 0) { noRes.style.display = 'flex'; return; }
  filtered.forEach(a => grid.appendChild(renderCard(a)));
}

// ─── Interactions ──────────────────────────────────────────────────
function selectCard(id) {
  closeMenus();
  selectedId = id === selectedId ? null : id;
  render();
  const panel = document.getElementById('side-panel');
  if (!selectedId) { panel.classList.add('hidden'); return; }
  panel.classList.remove('hidden');
  const a = ARTICLES.find(x => x.id === selectedId);
  document.getElementById('panel-title').textContent = a.title;
  document.getElementById('panel-destinations').innerHTML = ['medium','hashnode','devto'].map(p => {
    const d = a.destinations[p];
    return `<div style="display:flex;align-items:center;justify-content:space-between;">
      <span style="color:#c9cfe0;font-size:12px;">${PLATFORM_LABEL[p]}</span>
      <div style="display:flex;align-items:center;gap:6px;">
        <span style="width:7px;height:7px;border-radius:50%;background:${DOT_COLOR[d.status]||'#252a38'};display:inline-block;"></span>
        <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:${DOT_COLOR[d.status]||'#5a6080'}">${d.label}</span>
      </div>
    </div>`;
  }).join('');
  document.getElementById('panel-timeline').innerHTML = a.timeline.map(t =>
    `<div style="display:flex;gap:8px;">
      <span style="color:#5a6080;font-family:'JetBrains Mono',monospace;font-size:10px;width:48px;flex-shrink:0;padding-top:1px;">${t.time}</span>
      <span style="color:#c9cfe0;font-size:12px;line-height:1.5;">${t.event}</span>
    </div>`
  ).join('');
  const pb = document.getElementById('panel-primary-btn');
  pb.textContent = a.action.label;
  pb.style.background = a.action.bg;
  pb.style.color = a.action.color;
  pb.style.border = `1px solid ${a.action.border}`;
}

function closePanel() { selectedId = null; render(); document.getElementById('side-panel').classList.add('hidden'); }

function setStatusFilter(val, el) {
  statusFilter = val;
  document.querySelectorAll('.pill-filter').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  applyFilters();
}

function togglePlatform(p, el) {
  platformFilter.has(p) ? platformFilter.delete(p) : platformFilter.add(p);
  el.classList.toggle('active');
  applyFilters();
}

function applyFilters() { render(); }

function clearFilters() {
  document.getElementById('search-input').value = '';
  statusFilter = 'all';
  platformFilter.clear();
  document.querySelectorAll('.pill-filter').forEach(b => b.classList.remove('active'));
  document.getElementById('sf-all').classList.add('active');
  document.querySelectorAll('.pill-platform').forEach(b => b.classList.remove('active'));
  render();
}

function toggleSkeleton() { showSkeleton = !showSkeleton; showEmpty = false; render(); }
function toggleEmpty()    { showEmpty = !showEmpty; showSkeleton = false; render(); }

function setView(v) {
  document.querySelectorAll('.nav-tab').forEach(t => {
    t.style.borderBottomColor = 'transparent';
    t.style.color = '#5a6080';
    t.style.fontWeight = '400';
  });
  const el = document.getElementById('nav-' + v);
  if (el) { el.style.borderBottomColor = '#6366f1'; el.style.color = '#e8eaf2'; el.style.fontWeight = '500'; }
}

function toggleMenu(id, wrap) {
  if (openMenuId === id) { closeMenus(); return; }
  closeMenus();
  openMenuId = id;
  const menu = document.createElement('div');
  menu.className = 'ctx-menu';
  menu.innerHTML = `
    <button class="ctx-item" onclick="alert('Edit ${id}');closeMenus()">Edit</button>
    <button class="ctx-item" onclick="alert('Duplicate ${id}');closeMenus()">Duplicate</button>
    <button class="ctx-item" onclick="alert('Archive ${id}');closeMenus()">Archive</button>
    <button class="ctx-item danger" onclick="alert('Delete ${id}');closeMenus()">Delete</button>`;
  wrap.appendChild(menu);
  setTimeout(() => document.addEventListener('click', closeMenus, { once: true }), 0);
}

function closeMenus() {
  document.querySelectorAll('.ctx-menu').forEach(m => m.remove());
  openMenuId = null;
}

render();
</script>
</body>
</html>
