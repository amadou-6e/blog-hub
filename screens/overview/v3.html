<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BlogHub — Overview v3</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            surface:     '#0f1117',
            panel:       '#181c27',
            border:      '#252a38',
            'border-hi': '#3a3f52',
            muted:       '#5a6080',
            text:        '#c9cfe0',
            bright:      '#e8eaf2',
            accent:      '#6366f1',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body { background: #0f1117; color: #c9cfe0; margin: 0; }

    /* Shimmer */
    @keyframes shimmer {
      0%   { background-position: -600px 0; }
      100% { background-position:  600px 0; }
    }
    .shimmer {
      background: linear-gradient(90deg, #1a1f2e 25%, #21273d 50%, #1a1f2e 75%);
      background-size: 1200px 100%;
      animation: shimmer 1.8s infinite linear;
      border-radius: 4px;
    }

    /* Card */
    .article-card {
      background: #181c27;
      border: 1px solid #252a38;
      border-radius: 8px;
      cursor: pointer;
      transition: border-color 120ms, background 120ms;
      display: grid;
      grid-template-columns: 4px 276px minmax(0, 1fr);
      grid-template-rows: 39px 201px;
      overflow: hidden;
      height: 241px;
      min-height: 241px;
      width: 100%;
      max-width: 750px;
    }
    .article-card:hover  { border-color: #3a3f52; background: #1b2030; }
    .article-card.selected { border-color: #6366f1; background: #1a1f30; }

    .accent-bar { grid-column: 1; grid-row: 1 / 3; width: 4px; }

    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

    /* Filter pills */
    .pill-filter {
      font-size: 12px; padding: 4px 10px; border-radius: 6px;
      cursor: pointer; transition: background 100ms, color 100ms;
      color: #5a6080; background: transparent; border: none; font-family: inherit;
    }
    .pill-filter:hover  { color: #c9cfe0; }
    .pill-filter.active { color: #e8eaf2; background: #252a38; font-weight: 500; }

    .pill-platform {
      font-size: 12px; padding: 4px 10px; border-radius: 6px;
      cursor: pointer; border: 1px solid #252a38;
      background: transparent; color: #5a6080; font-family: inherit;
      transition: border-color 100ms, color 100ms, background 100ms;
    }
    .pill-platform:hover  { color: #c9cfe0; border-color: #3a3f52; }
    .pill-platform.active { color: #e8eaf2; background: #1e2230; border-color: #3a3f52; }

    /* Side panel */
    #side-panel {
      flex-shrink: 0;
      display: flex;
      flex-direction: row;
      overflow: hidden;
      background: #13172a;
      transition: width 140ms ease, flex-basis 140ms ease, opacity 140ms ease;
    }
    #side-panel.hidden {
      width: 0;
      flex-basis: 0;
      opacity: 0;
      pointer-events: none;
    }
    #side-strip {
      width: 12px;
      flex-shrink: 0;
      border-left: 1px solid #252a38;
      border-right: 1px solid #252a38;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: #13172a;
      transition: background 100ms;
    }
    #side-strip:hover { background: #181d31; }
    #panel-content {
      width: 288px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #13172a;
    }
    #panel-job-region {
      margin: 0 16px 12px;
      padding: 10px;
      border: 1px solid #30364a;
      border-radius: 6px;
      background: #181d2d;
    }
    #panel-job-region[data-tone="error"] { border-color: #5a3038; background: #21181f; }
    #panel-job-region[data-tone="warning"] { border-color: #554921; background: #211e16; }
    #panel-job-region[data-tone="success"] { border-color: #28523c; background: #15231d; }
    .panel-job-action {
      font: 500 11px Inter, system-ui, sans-serif;
      padding: 5px 8px;
      border-radius: 5px;
      border: 1px solid #3a4054;
      color: #c9cfe0;
      background: transparent;
      cursor: pointer;
    }
    .panel-job-action:hover { border-color: #6366f1; color: #fff; }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #252a38; border-radius: 3px; }

    /* Context menu */
    .ctx-menu {
      position: absolute; top: 100%; right: 0;
      background: #1e2335; border: 1px solid #3a3f52;
      border-radius: 6px; padding: 4px; z-index: 50;
      min-width: 140px; box-shadow: 0 8px 24px #00000060;
    }
    .ctx-item {
      display: block; width: 100%; text-align: left;
      padding: 6px 10px; font-size: 12px; border-radius: 4px;
      color: #c9cfe0; background: transparent; border: none;
      cursor: pointer; font-family: inherit;
    }
    .ctx-item:hover { background: #252a38; }
    .ctx-item.danger { color: #f87171; }
    .ctx-item.danger:hover { background: #2d1a1a; }

    /* Platform tab in preview pane */
    .plat-tab {
      display: flex; align-items: center; gap: 5px;
      padding: 4px 8px 4px 6px;
      border-radius: 4px; cursor: pointer;
      font-size: 10px; font-weight: 600;
      text-transform: uppercase; letter-spacing: .07em;
      color: #5a6080; background: transparent; border: none;
      font-family: inherit;
      transition: color 100ms, background 100ms;
      flex-shrink: 0;
    }
    .plat-tab:hover { color: #c9cfe0; }
    .plat-tab.active { color: #e8eaf2; background: #1e2438; }

    .act {
      flex-shrink: 0; width: 76px; text-align: center;
      font-size: 11px; font-weight: 500; padding: 4px 0;
      border-radius: 5px; border: 1px solid transparent;
      cursor: pointer; font-family: inherit; white-space: nowrap;
    }
    .act:disabled { cursor: default; opacity: 0.6; }

    .preview-frame {
      position: relative;
      height: 100%;
      aspect-ratio: 1200 / 630;
      max-width: 100%;
      margin-left: auto;
      border: 1px solid #252a38;
      border-radius: 8px;
      overflow: hidden;
      background: #10131c;
    }

    .article-card-tabs {
      grid-column: 2 / 4;
      grid-row: 1;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 6px 14px 6px 17px;
      border-bottom: 1px solid #252a38;
    }
    .article-card-media {
      grid-column: 2;
      grid-row: 2;
      width: 273px;
      height: 187px;
      margin: 3px 0 0 3px;
      overflow: hidden;
      background: #10131c;
    }
    .article-card-copy {
      grid-column: 3;
      grid-row: 2;
      min-width: 0;
      padding: 6px 17px 12px 12px;
      display: grid;
      grid-template-rows: auto auto 1fr 1px 56px;
    }
    .article-card-title {
      align-self: start;
      color: #c9cfe0;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.25;
    }
    .article-card-subtitle {
      align-self: start;
      color: #c9cfe0;
      font-size: 14px;
      line-height: 1.3;
      margin-top: 4px;
    }
    .article-card-excerpt {
      align-self: start;
      color: #c9cfe0;
      font-size: 12px;
      line-height: 1.45;
      margin-top: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .article-card-divider { background: #252a38; }
    .article-card-footer {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-top: 14px;
      min-width: 0;
    }
    .article-status {
      width: 88px;
      height: 26px;
      border-radius: 5px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 10px;
      font-weight: 600;
    }
    .article-card-date {
      color: #5a6080;
      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
      white-space: nowrap;
      margin-left: 12px;
    }
    .article-card-actions {
      display: flex;
      gap: 7px;
      margin-left: auto;
    }
    .card-action {
      width: 62px;
      height: 28px;
      padding: 0;
      border-radius: 5px;
      border: 1px solid #252a38;
      background: #181c27;
      color: #c9cfe0;
      cursor: pointer;
      font: 500 12px/1 Inter, system-ui, sans-serif;
    }
    .card-action:hover { border-color: #3a3f52; color: #e8eaf2; }
    .card-action:disabled { color: #5a6080; cursor: default; }
    .card-action:disabled:hover { border-color: #252a38; }

    .status-draft { background:#10131c; border:1px solid #6ea8fe; color:#6ea8fe; }
    .status-published { background:#0e2d22; border:1px solid #1a4d35; color:#4ade80; }
    .status-ready { background:#151a28; border:1px solid #4a5068; color:#8a93b0; }
    .status-pending { background:#1a1600; border:1px solid #3a3010; color:#fbbf24; }
    .status-error { background:#1e1818; border:1px solid #3a2828; color:#f87171; }

    .article-card-media > img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .article-card-media .preview-frame {
      width: 100%;
      height: 100%;
      aspect-ratio: auto;
      margin: 0;
      border: 0;
      border-radius: 0;
    }

    /* Load-more region */
    #load-more-region {
      margin-top: 16px;
    }
    #load-more-region:empty {
      margin-top: 0;
    }
    .load-more-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 20px 0 8px;
      width: 100%;
    }
    .load-more-status {
      font-size: 12px;
      color: #5a6080;
      font-family: 'JetBrains Mono', monospace;
      text-align: center;
    }
    .load-more-btn {
      font-size: 12px;
      font-weight: 500;
      padding: 8px 18px;
      border-radius: 6px;
      background: #181c27;
      color: #c9cfe0;
      border: 1px solid #252a38;
      cursor: pointer;
      font-family: inherit;
      transition: border-color 100ms, color 100ms, background 100ms;
    }
    .load-more-btn:hover  { border-color: #3a3f52; color: #e8eaf2; background: #1b2030; }
    .load-more-btn:focus-visible { outline: 2px solid #6366f1; outline-offset: 2px; }
    .load-more-btn:disabled { cursor: default; opacity: 0.6; }
    .load-more-error {
      font-size: 12px;
      color: #f87171;
      text-align: center;
    }
    .load-more-retry-btn {
      font-size: 12px;
      font-weight: 500;
      padding: 8px 18px;
      border-radius: 6px;
      background: #1e1818;
      color: #f87171;
      border: 1px solid #3a2828;
      cursor: pointer;
      font-family: inherit;
    }
    .load-more-retry-btn:hover { border-color: #4d2a2a; }
    .load-more-retry-btn:focus-visible { outline: 2px solid #f87171; outline-offset: 2px; }
    .load-more-skeletons {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    @media (max-width: 760px) {
      .article-card {
        height: auto;
        min-height: 0;
        grid-template-columns: 4px minmax(0, 1fr);
        grid-template-rows: 39px 180px auto;
      }
      .article-card-tabs {
        grid-column: 2;
        overflow-x: auto;
      }
      .article-card-media {
        grid-column: 2;
        grid-row: 2;
        width: 100%;
        height: 180px;
        margin: 0;
      }
      .article-card-copy {
        grid-column: 2;
        grid-row: 3;
        padding: 14px 16px 16px;
        grid-template-rows: auto auto auto 1px auto;
        gap: 0;
      }
      .article-card-footer {
        flex-wrap: wrap;
        padding-top: 2px;
      }
      .article-card-date { margin-left: 0; }
      .article-card-actions { width: 100%; }
      .card-action { flex: 1; }
      .accent-bar { grid-row: 1 / 4; }
      .article-card-title, .article-card-subtitle { align-self: start; }
      .article-card-excerpt { padding-top: 0; }
      .article-card-divider { margin-top: 2px; }
      .article-status { width: 80px; }
      .article-card-date { flex: 1; }
      .article-card-actions { margin-left: 0; }
      .article-card-actions .card-action { min-width: 0; }
      .article-card-media .preview-frame {
        width: 100%;
        height: 100%;
        aspect-ratio: auto;
        border: 0;
        border-radius: 0;
      }
    }
  </style>
</head>
<body class="font-sans" style="height:100vh;display:flex;flex-direction:column;overflow:hidden;">

<!-- -------------------------------------------
     ZONE A: Top nav
------------------------------------------------ -->
<nav style="height:48px;background:#0f1117;border-bottom:1px solid #252a38;flex-shrink:0;display:flex;align-items:center;padding:0 32px;z-index:40;">
  <!-- Logo — left, flex:1 so it doesn't shrink into tabs -->
  <div style="flex:1;display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden;">
    <div style="width:22px;height:22px;border-radius:5px;background:#6366f1;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
        <path d="M2 2h8M2 6h5M2 10h7" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </div>
    <span style="color:#e8eaf2;font-weight:600;font-size:14px;letter-spacing:-0.02em;white-space:nowrap;">BlogHub</span>
  </div>
  <!-- Nav tabs — center, no grow so logo and actions stay in their own lanes -->
  <div style="display:flex;align-items:stretch;height:48px;flex-shrink:0;">
    <button onclick="setView('articles')"  id="nav-articles"  class="nav-tab" style="padding:0 14px;font-size:13px;border:none;cursor:pointer;font-family:inherit;background:transparent;border-bottom:2px solid #6366f1;color:#e8eaf2;font-weight:500;">Articles</button>
    <button onclick="setView('queue')"     id="nav-queue"     class="nav-tab" style="padding:0 14px;font-size:13px;border:none;cursor:pointer;font-family:inherit;background:transparent;border-bottom:2px solid transparent;color:#5a6080;">Queue</button>
    <button onclick="setView('platforms')" id="nav-platforms" class="nav-tab" style="padding:0 14px;font-size:13px;border:none;cursor:pointer;font-family:inherit;background:transparent;border-bottom:2px solid transparent;color:#5a6080;">Platforms</button>
    <button onclick="setView('settings')"  id="nav-settings"  class="nav-tab" style="padding:0 14px;font-size:13px;border:none;cursor:pointer;font-family:inherit;background:transparent;border-bottom:2px solid transparent;color:#5a6080;">Settings</button>
  </div>
  <!-- Right actions — flex:1 justify-end keeps it in its own lane -->
  <div style="flex:1;display:flex;align-items:center;gap:14px;justify-content:flex-end;min-width:0;">
    <div id="connected-count" style="display:flex;align-items:center;gap:6px;font-size:12px;color:#5a6080;">
      <span style="width:6px;height:6px;border-radius:50%;background:#4ade80;display:inline-block;"></span>
      3 platforms connected
    </div>
    <!-- Split button (variant A): left = New article, right chevron = dropdown -->
    <div style="position:relative;display:flex;border-radius:6px;overflow:visible;border:1px solid #4f52d9;" id="split-btn-wrap">
      <button onclick="window.location.href='../create-article/v1.html'"
        style="display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:6px 12px;background:#6366f1;color:#fff;border:none;border-right:1px solid #4f52d9;cursor:pointer;font-family:inherit;border-radius:5px 0 0 5px;">
        <svg width="10" height="10" viewBox="0 0 12 12" fill="none"><path d="M6 1v10M1 6h10" stroke="white" stroke-width="2" stroke-linecap="round"/></svg>
        New article
      </button>
      <button onclick="toggleImportMenu(event)" id="create-menu-btn"
        style="display:flex;align-items:center;padding:6px 8px;background:#6366f1;color:#ffffffcc;border:none;cursor:pointer;border-radius:0 5px 5px 0;">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <!-- Dropdown styled like variant C: icon box + title + subtitle -->
      <div id="import-menu" style="display:none;position:absolute;top:calc(100% + 6px);right:0;background:#181c27;border:1px solid #252a38;border-radius:8px;padding:4px;z-index:50;width:240px;box-shadow:0 8px 24px #00000066;">
        <button onclick="window.location.href='../import-article/v1.html?mode=platform&returnTo=overview'"
          style="display:flex;align-items:center;gap:9px;width:100%;padding:8px 12px;font-size:13px;color:#c9cfe0;background:transparent;border:none;cursor:pointer;font-family:inherit;border-radius:5px;text-align:left;transition:background 80ms;"
          onmouseover="this.style.background='#252a38'" onmouseout="this.style.background='transparent'">
          <div style="width:26px;height:26px;border-radius:5px;background:#1e2a1e;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          </div>
          <div><div>Import from platform</div><div style="font-size:11px;color:#5a6080;margin-top:1px;">Fetch a draft from a connected platform</div></div>
        </button>
        <button onclick="window.location.href='../import-article/v1.html?mode=upload&returnTo=overview'"
          style="display:flex;align-items:center;gap:9px;width:100%;padding:8px 12px;font-size:13px;color:#c9cfe0;background:transparent;border:none;cursor:pointer;font-family:inherit;border-radius:5px;text-align:left;transition:background 80ms;"
          onmouseover="this.style.background='#252a38'" onmouseout="this.style.background='transparent'">
          <div style="width:26px;height:26px;border-radius:5px;background:#1e2028;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#c9cfe0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          </div>
          <div><div>Upload .md file</div><div style="font-size:11px;color:#5a6080;margin-top:1px;">Use an existing markdown document</div></div>
        </button>
      </div>
    </div>
  </div>
</nav>

<!-- Body -->
<div style="flex:1;display:flex;overflow:hidden;">

  <!-- Left: filter bar + grid -->
  <div style="flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;">

    <!-- -------------------------------------------
         ZONE B: Filter bar (two-row)
    ------------------------------------------------ -->
    <div id="filterbar" style="flex-shrink:0;border-bottom:1px solid #252a38;background:#0f1117;padding:18px 32px 8px;">
      <div style="display:flex;align-items:center;gap:8px;">
        <!-- Search -->
        <div style="position:relative;flex-shrink:0;">
          <svg style="position:absolute;left:9px;top:50%;transform:translateY(-50%);color:#5a6080;" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path stroke-linecap="round" d="m21 21-4.35-4.35"/></svg>
          <input id="search-input" type="text" placeholder="Search articles…" oninput="applyFilters()"
            style="padding:6px 10px 6px 30px;font-size:12px;border-radius:6px;border:1px solid #252a38;background:#181c27;color:#c9cfe0;width:260px;font-family:inherit;outline:none;"
            onfocus="this.style.borderColor='#6366f1'" onblur="this.style.borderColor='#252a38'" />
        </div>
        <!-- Vertical line after search -->
        <div style="width:1px;height:14px;background:#252a38;flex-shrink:0;"></div>
        <!-- Status pills -->
        <div style="display:flex;align-items:center;gap:2px;">
          <button class="pill-filter active" id="sf-all"       onclick="setStatusFilter('all',this)">All</button>
          <button class="pill-filter"        id="sf-drafting"  onclick="setStatusFilter('drafting',this)">Drafting</button>
          <button class="pill-filter"        id="sf-ready"     onclick="setStatusFilter('ready',this)">Ready</button>
          <button class="pill-filter"        id="sf-error"     onclick="setStatusFilter('error',this)">Error</button>
          <button class="pill-filter"        id="sf-published" onclick="setStatusFilter('published',this)">Published</button>
        </div>
        <!-- Divider -->
        <div style="width:1px;height:14px;background:#252a38;flex-shrink:0;"></div>
        <!-- Platform pills -->
        <div style="display:flex;align-items:center;gap:4px;">
          <button class="pill-platform" id="pf-medium"   onclick="togglePlatform('medium',this)">Medium</button>
          <button class="pill-platform" id="pf-hashnode" onclick="togglePlatform('hashnode',this)">Hashnode</button>
          <button class="pill-platform" id="pf-devto"    onclick="togglePlatform('devto',this)">Dev.to</button>
        </div>
        <!-- Article count pushed to the right -->
        <span id="article-count" style="margin-left:auto;font-size:12px;color:#5a6080;font-family:'JetBrains Mono',monospace;white-space:nowrap;">— articles</span>
      </div>
    </div>

    <!-- -------------------------------------------
         ZONE C: Card list (single column)
    ------------------------------------------------ -->
    <div id="grid-area" style="flex:1;overflow-y:auto;padding:24px 32px;">
      <div id="card-grid" style="display:grid;grid-template-columns:minmax(0, 750px);justify-content:center;gap:12px;width:100%;margin:0 auto;"></div>

      <div id="load-more-region" style="display:grid;grid-template-columns:minmax(0, 750px);justify-content:center;width:100%;margin:0 auto;"></div>

<script>
// --- Data ----------------------------------------------------------
let ARTICLES = [];

// --- Per-platform thumbnail palette --------------------------------
// Each entry: { heading, para, codeBlock, codeLine1, codeLine2, codeLine3, codeLine4, imagePlaceholder, fade }
const PLATFORM_PALETTE = {
  medium: {
    heading:     '#c9a96e',   // warm amber
    para:        '#1e2438',
    codeBlock:   '#0f1117',
    codeLine1:   '#c9a96e33',

    codeLine4:   '#b8924033',

  },

    para:        '#1e2a3e',
    codeBlock:   '#090e1a',
    codeLine1:   '#60a5fa33',
    codeLine2:   '#3b82f622',
    codeLine3:   '#60a5fa33',
    codeLine4:   '#818cf822',
    imageBg:     '#111827',
    imageStroke: '#2d4a7a',
    fade:        '#181c27',
  },
  devto: {
    heading:     '#4ade80',   // green
    para:        '#1e2438',
    codeBlock:   '#0f1117',
    codeLine1:   '#4ade8033',
    codeLine2:   '#34d39922',
    codeLine3:   '#4ade8033',
    codeLine4:   '#86efac22',
    imageBg:     '#1a1e2a',
    imageStroke: '#2a4a35',
    fade:        '#181c27',
  },
};

const PLATFORM_LABEL = { medium: 'Medium', hashnode: 'Hashnode', devto: 'Dev.to' };

// --- State ---------------------------------------------------------
let selectedId     = null;
let statusFilter   = 'all';
let platformFilter = new Set();
let showSkeleton   = false;
let showEmpty      = false;
let openMenuId     = null;
let detailsPanelOpen = true;
const SELECTED_ARTICLE_KEY = 'bloghub:overview:selected-article';
// Per-card active preview platform: Map<articleId, 'medium'|'hashnode'|'devto'>
const activePreview = new Map();

// --- Pagination state ------------------------------------------------
const PAGE_SIZE = 100;
let currentPage       = 1;     // number of raw pages currently loaded (from page 1)
let totalArticleCount = 0;     // server-reported total, across all pages
let isLoadingMore     = false; // a "Load more" fetch is in flight
let loadMoreError     = null;  // message from the last failed "Load more" attempt
let overviewLoadGeneration = 0; // invalidates stale full-overview reloads
let pageLoadGeneration     = 0; // invalidates stale incremental page loads
const loadedArticleIds = new Set();

// --- Helpers -------------------------------------------------------
const DOT_COLOR = {
  draft: '#6ea8fe', ready: '#4ade80', published: '#38bdf8',
  pending: '#fbbf24', error: '#f87171', none: '#252a38', review: '#fbbf24',
};
const GATE_COLOR = { pass: '#4ade80', warn: '#fbbf24', fail: '#f87171', pending: '#5a6080' };
const GATE_LABEL = { pass: '✓ Pass', warn: '⚠ Warn', fail: '✗ Fail', pending: '—' };
let jobLifecycle = null;

function formatRelative(isoValue) {
  const date = new Date(isoValue);
  if (Number.isNaN(date.getTime())) return String(isoValue || '');
  const diffMs = Date.now() - date.getTime();
  const diffHours = Math.floor(diffMs / 3600000);
  if (diffHours < 1) return `${Math.max(1, Math.floor(diffMs / 60000))}m ago`;
  if (diffHours < 24) return `${diffHours}h ago`;
  const diffDays = Math.floor(diffHours / 24);
  if (diffDays < 7) return `${diffDays}d ago`;
  return `${Math.floor(diffDays / 7)}w ago`;
}

function formatTimelineTime(isoValue) {
  const date = new Date(isoValue);
  if (Number.isNaN(date.getTime())) return String(isoValue || '');
  return date.toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function chooseAction(article) {
  const destinations = Object.values(article.destinations);
  const links = destinations.map(d => d.url).filter(Boolean);
  if (article.gate === 'fail' || destinations.some(d => d.status === 'error')) {
    return { kind: 'inspect', label: 'Inspect →', color: '#f87171', bg: '#2d1a1a', border: '#4d2a2a' };
  }
  if (destinations.every(d => d.status === 'published' || d.status === 'none') && links.length > 0) {
    return { kind: 'open', label: 'View live ↗', color: '#38bdf8', bg: '#0d2830', border: '#1a3d4a', url: links[0] };
  }
  if (destinations.some(d => d.status === 'ready')) {
    return { kind: 'schedule', label: 'Schedule →', color: '#fff', bg: '#6366f1', border: '#6366f1' };
  }
  return { kind: 'push', label: 'Push drafts →', color: '#fff', bg: '#6366f1', border: '#6366f1' };
}

function preferredLiveUrl(article, platform) {
  const preferredDestination = article.destinations[platform];
  if (preferredDestination && preferredDestination.url) return preferredDestination.url;
  for (const status of ['published', 'draft', 'ready', 'review', 'pending']) {
    for (const name of ['medium', 'hashnode', 'devto']) {
      const destination = article.destinations[name];
      if (destination && destination.status === status && destination.url) {
        return destination.url;
      }
    }
  }
  return null;
}

function buildLiveArticle(raw, index) {
  return {
    id: raw.id,
    urgency: index + 1,
    title: raw.title,
    updatedAt: raw.updatedAt,
    updated: formatRelative(raw.updatedAt),
    words: raw.wordCount,
    previewImageUrl: raw.previewImageUrl || null,
    source: raw.source || 'native',
    sourcePlatform: raw.sourcePlatform || null,
    destinations: {
      medium: raw.destinations.medium,
      hashnode: raw.destinations.hashnode,
      devto: raw.destinations.devto,
    },
    gate: raw.gate,
    action: chooseAction(raw),
    timeline: (raw.recentTimeline || []).map(item => ({
      time: formatTimelineTime(item.timestamp),
      event: item.event,
    })),
  };
}

async function fetchJson(url, options = {}) {
  const response = await fetch(url, options);
  if (!response.ok) {
    let message = `Request failed: ${response.status}`;
    const body = await response.text();
    try {
      const payload = JSON.parse(body);
      message = typeof payload.detail === 'string'
        ? payload.detail
        : payload.detail?.message || payload.detail?.error || message;
    } catch (_) {
      if (body) message = body;
    }
    const error = new Error(message);
    error.status = response.status;
    throw error;
  }
  return response.json();
}

function articlesPageUrl(page) {
  return `/api/articles?sortBy=updatedAt&sortDir=desc&page=${page}&pageSize=${PAGE_SIZE}`;
}

// Fetch pages 1..pagesToLoad and concatenate them, preserving server order.
// Returns null if a newer load generation started while this was in flight.
async function fetchArticlePages(pagesToLoad, generation) {
  let items = [];
  let total = 0;
  for (let page = 1; page <= pagesToLoad; page += 1) {
    const payload = await fetchJson(articlesPageUrl(page));
    if (generation !== overviewLoadGeneration) return null; // superseded — discard
    items = items.concat(payload.items);
    total = payload.total;
  }
  return { items, total };
}

// Full reload: re-fetches from page 1 up to the current pagination depth, so an
// action-triggered refresh (push/inspect/etc.) never collapses an already
// expanded list back down to the first 100 articles.
async function loadOverview() {
  const generation = (overviewLoadGeneration += 1);
  pageLoadGeneration += 1;
  isLoadingMore = false;
  loadMoreError = null;

  const pagesToLoad = Math.max(1, currentPage);
  const [articlesResult, connectionsPayload] = await Promise.all([
    fetchArticlePages(pagesToLoad, generation),
    fetchJson('/api/connections'),
  ]);

  if (generation !== overviewLoadGeneration || articlesResult === null) return; // stale

  loadedArticleIds.clear();
  ARTICLES = articlesResult.items.map((raw, index) => {
    loadedArticleIds.add(raw.id);
    return buildLiveArticle(raw, index);
  });
  totalArticleCount = articlesResult.total;
  currentPage = pagesToLoad;

  const connected = connectionsPayload.connections.filter(
    item => ['medium', 'hashnode', 'devto'].includes(item.id) && item.status === 'connected'
  );
  document.getElementById('connected-count').innerHTML = `
    <span style="width:6px;height:6px;border-radius:50%;background:#4ade80;display:inline-block;"></span>
    ${connected.length} platforms connected
  `;

  if (hasActiveFilters()) await loadRemainingArticlesForFilters();
}

function hasMoreArticles() {
  return ARTICLES.length < totalArticleCount;
}

function hasActiveFilters() {
  const query = document.getElementById('search-input').value.trim();
  return query.length > 0 || statusFilter !== 'all' || platformFilter.size > 0;
}

function appendArticlePage(payload, page) {
  const newItems = payload.items.filter(raw => !loadedArticleIds.has(raw.id));
  const startIndex = ARTICLES.length;
  const mapped = newItems.map((raw, i) => {
    loadedArticleIds.add(raw.id);
    return buildLiveArticle(raw, startIndex + i);
  });
  ARTICLES = ARTICLES.concat(mapped);
  totalArticleCount = payload.total;
  currentPage = page;
}

// Incremental "Load more": fetches the next raw page and appends it without
// touching already-rendered cards (so activePreview / selection state for
// existing cards is untouched — see renderCard()).
async function loadMoreArticles() {
  if (isLoadingMore || !hasMoreArticles()) return;
  const generation = pageLoadGeneration;
  const nextPage = currentPage + 1;

  isLoadingMore = true;
  loadMoreError = null;
  render();

  try {
    const payload = await fetchJson(articlesPageUrl(nextPage));
    if (generation !== pageLoadGeneration) return; // superseded
    appendArticlePage(payload, nextPage);
  } catch (error) {
    if (generation === pageLoadGeneration) {
      loadMoreError = error.message || 'Failed to load more articles.';
    }
  } finally {
    if (generation === pageLoadGeneration) isLoadingMore = false;
    render();
  }
}

async function loadRemainingArticlesForFilters() {
  if (isLoadingMore || !hasActiveFilters() || !hasMoreArticles()) return;
  const generation = pageLoadGeneration;
  isLoadingMore = true;
  loadMoreError = null;
  render();

  try {
    while (generation === pageLoadGeneration && hasMoreArticles()) {
      const nextPage = currentPage + 1;
      const payload = await fetchJson(articlesPageUrl(nextPage));
      if (generation !== pageLoadGeneration) return;
      appendArticlePage(payload, nextPage);
    }
  } catch (error) {
    if (generation === pageLoadGeneration) {
      loadMoreError = error.message || 'Failed to load all articles for filtering.';
    }
  } finally {
    if (generation === pageLoadGeneration) isLoadingMore = false;
    render();
  }
}

// Any change to search/status/platform filters invalidates an in-flight
// "Load more" response: the response itself is still valid data, but by the
// time it would land the user has already moved on to a different filtered
// view, so we drop it rather than risk it landing after — and clobbering —
// state the user has since changed. The user can simply press "Load more"
// again once filters settle.
function invalidateInFlightPageLoad() {
  pageLoadGeneration += 1;
  isLoadingMore = false;
  loadMoreError = null;
}

async function runArticleAction(article, overrideKind = null) {
  const action = overrideKind ? { ...article.action, kind: overrideKind } : article.action;
  if (action.kind === 'open' && action.url) {
    window.open(action.url, '_blank', 'noopener,noreferrer');
    return;
  }
  if (action.kind === 'schedule') {
    return;
  }
  const endpoint = action.kind === 'inspect' ? 'inspect' : 'push';
  await jobLifecycle.submit(article.id, endpoint);
}

function platformActionProps(status) {
  switch (status) {
    case 'draft': case 'review':
      return { label: 'Publish',    bg: '#0e2d22',    border: '#1a4d35', color: '#4ade80', disabled: false };
    case 'ready':
      return { label: 'Schedule',   bg: 'transparent', border: '#4a5068', color: '#8a93b0', disabled: false };
    case 'published':
      return { label: 'View ↗',     bg: 'transparent', border: '#4a5068', color: '#8a93b0', disabled: false };
    case 'pending':
      return { label: 'Pending',    bg: '#1a1600',    border: '#3a3010', color: '#5a6080', disabled: true };
    case 'error':
      return { label: 'Retry',      bg: '#1e1818',    border: '#3a2828', color: '#c07070', disabled: false };
    default:
      return { label: 'Push draft', bg: 'transparent', border: '#4a5068', color: '#8a93b0', disabled: false };
  }
}

function accentForArticle(a) {
  if (a.gate === 'fail') return '#f87171';
  if (a.gate === 'warn') return '#fbbf24';
  if (Object.values(a.destinations).every(d => d.status === 'published')) return '#38bdf8';
  return '#6366f1';
}

function defaultPreviewPlatform(a) {
  // Pick first platform that has a real status
  for (const p of ['medium', 'hashnode', 'devto']) {
    if (a.destinations[p].status !== 'none') return p;
  }
  return 'medium';
}

function matchesFilters(a) {
  const q = document.getElementById('search-input').value.toLowerCase();
  if (q && !a.title.toLowerCase().includes(q)) return false;
  if (statusFilter !== 'all') {
    const statuses = Object.values(a.destinations).map(d => d.status);
    if (statusFilter === 'error'     && !statuses.includes('error'))     return false;
    if (statusFilter === 'ready'     && !statuses.includes('ready'))     return false;
    if (statusFilter === 'published' && !statuses.every(d => d === 'published')) return false;
    if (statusFilter === 'drafting'  && !statuses.some(d => ['draft','pending','review'].includes(d))) return false;
  }
  if (platformFilter.size > 0) {
    const hasPlatform = [...platformFilter].some(p => a.destinations[p] && a.destinations[p].status !== 'none');
    if (!hasPlatform) return false;
  }
  return true;
}

    `A focused guide to ${article.title}`,
    'Review the destination-specific preview, article status, and publishing details before making changes.',
  ];

function cardStatus(status) {
  if (status === 'published') return { label: 'Published', className: 'status-published' };
  if (status === 'ready') return { label: 'Ready', className: 'status-ready' };
  if (status === 'pending') return { label: 'Pending', className: 'status-pending' };
  if (status === 'error') return { label: 'Error', className: 'status-error' };
  return { label: 'Draft', className: 'status-draft' };
}

function formatCardDate(value) {
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return '';
  return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

// --- Card renderer -------------------------------------------------
function renderCard(a) {
  const isSelected = selectedId === a.id;
  const activePlatform = activePreview.get(a.id) || defaultPreviewPlatform(a);
  const destination = a.destinations[activePlatform];
  const accent = DOT_COLOR[destination.status] || '#6366f1';
  const status = cardStatus(destination.status);
  const [subtitle, excerpt] = articleCardCopy(a);
  const liveUrl = preferredLiveUrl(a, activePlatform);

  const card = document.createElement('article');
  card.className = 'article-card' + (isSelected ? ' selected' : '');
  card.dataset.id = a.id;
  card.onclick = (event) => {
    if (!event.target.closest('.plat-tab') && !event.target.closest('.card-action')) selectCard(a.id);
  };

  const bar = document.createElement('div');
  bar.className = 'accent-bar';
  bar.style.background = accent;
  card.appendChild(bar);

  const tabs = document.createElement('div');
  tabs.className = 'article-card-tabs';
  ['medium', 'hashnode', 'devto'].forEach(platform => {
    const isActive = platform === activePlatform;
    const tab = document.createElement('button');
    tab.className = 'plat-tab' + (isActive ? ' active' : '');
    tab.style.color = isActive ? '#e8eaf2' : '#5a6080';
    tab.style.background = isActive ? '#1e2438' : 'transparent';
    tab.innerHTML = `
      <span style="width:6px;height:6px;border-radius:50%;background:${DOT_COLOR[a.destinations[platform].status] || '#252a38'};flex-shrink:0;display:inline-block;"></span>
      <span class="tab-indicator" style="width:2px;height:10px;border-radius:1px;background:#6366f1;flex-shrink:0;margin:0 1px;display:inline-block;opacity:${isActive ? 1 : 0};"></span>
      <span>${PLATFORM_LABEL[platform]}</span>
    `;
    tab.onclick = event => {
      event.stopPropagation();
      activePreview.set(a.id, platform);
      render();
    };
    tabs.appendChild(tab);
  });
  card.appendChild(tabs);

  const media = document.createElement('div');
  media.className = 'article-card-media';
  const previewImageUrl = a.previewImageUrl || './assets/overview-card-cover.png';
  if (previewImageUrl) {
    const image = document.createElement('img');
    image.src = previewImageUrl;
    image.alt = `${a.title} preview on ${PLATFORM_LABEL[activePlatform]}`;
    media.appendChild(image);
  } else {
    media.innerHTML = buildPreviewMedia(a, activePlatform);
  }
  card.appendChild(media);

  const copy = document.createElement('div');
  copy.className = 'article-card-copy';
  copy.innerHTML = `
    <div class="article-card-title"></div>
    <div class="article-card-subtitle"></div>
    <div class="article-card-excerpt"></div>
    <div class="article-card-divider"></div>
    <div class="article-card-footer">
      <span class="article-status ${status.className}">${status.label}</span>
      <span class="article-card-date">${formatCardDate(a.updatedAt)} · ${a.words.toLocaleString()} words</span>
      <span class="article-card-actions">
        <button class="card-action card-visit" ${liveUrl ? '' : 'disabled'}>Visit</button>
        <button class="card-action card-edit">Edit</button>
      </span>
    </div>
  `;
  copy.querySelector('.article-card-title').textContent = a.title;
  copy.querySelector('.article-card-subtitle').textContent = subtitle;
  copy.querySelector('.article-card-excerpt').textContent = excerpt;
  copy.querySelector('.card-visit').onclick = event => {
    event.stopPropagation();
    if (liveUrl) window.open(liveUrl, '_blank', 'noopener,noreferrer');
  };
  copy.querySelector('.card-edit').onclick = event => {
    event.stopPropagation();
    window.location.href = `../editor/v2.html?id=${encodeURIComponent(a.id)}`;
  };
  card.appendChild(copy);
  return card;
}

// --- Skeleton card --------------------------------------------------
function renderSkeleton() {
  const card = document.createElement('div');
  card.className = 'article-card';
  card.style.cursor = 'default';
  card.innerHTML = `
    <div class="accent-bar" style="background:#252a38;"></div>
    <div class="article-card-tabs" style="gap:10px;">
      <div class="shimmer" style="height:20px;width:88px;"></div>
      <div class="shimmer" style="height:10px;width:78px;"></div>
      <div class="shimmer" style="height:10px;width:62px;"></div>
    </div>
    <div class="article-card-media shimmer"></div>
    <div class="article-card-copy">
      <div class="shimmer" style="align-self:center;height:16px;width:86%;"></div>
      <div class="shimmer" style="align-self:center;height:12px;width:72%;"></div>
      <div style="padding-top:4px;display:flex;flex-direction:column;gap:7px;">
        <div class="shimmer" style="height:8px;width:100%;"></div>
        <div class="shimmer" style="height:8px;width:92%;"></div>
        <div class="shimmer" style="height:8px;width:78%;"></div>
      </div>
      <div class="article-card-divider"></div>
      <div class="article-card-footer">
        <div class="shimmer" style="width:88px;height:26px;"></div>
        <div class="shimmer" style="width:132px;height:10px;margin-left:12px;"></div>
        <div class="article-card-actions">
          <div class="shimmer" style="width:62px;height:28px;"></div>
          <div class="shimmer" style="width:62px;height:28px;"></div>
        </div>
      </div>
    </div>`;
  return card;
}

// --- Load-more region -------------------------------------------------
// Renders the count/status text plus whichever control applies: a "Load
// more" button, an in-progress state (skeleton cards + status text), an
// error/retry state, or a "you've seen everything" completion message.
// This region lives below #card-grid so appending to it never resizes or
// reflows already-rendered cards above it.
function renderLoadMoreRegion() {
  const region = document.getElementById('load-more-region');
  region.innerHTML = '';

  const loadedCount = ARTICLES.length;
  if (loadedCount === 0) return;

  const panel = document.createElement('div');
  panel.className = 'load-more-panel';

  if (isLoadingMore) {
    const skeletons = document.createElement('div');
    skeletons.className = 'load-more-skeletons';
    for (let i = 0; i < 3; i += 1) skeletons.appendChild(renderSkeleton());
    panel.appendChild(skeletons);

    const status = document.createElement('div');
    status.className = 'load-more-status';
    status.setAttribute('role', 'status');
    status.setAttribute('aria-live', 'polite');
    status.textContent = `Loading more articles… (showing ${loadedCount} of ${totalArticleCount})`;
    panel.appendChild(status);
  } else if (loadMoreError) {
    const message = document.createElement('div');
    message.className = 'load-more-error';
    message.setAttribute('role', 'alert');
    message.textContent = `Couldn't load more articles: ${loadMoreError}`;
    panel.appendChild(message);

    const retry = document.createElement('button');
    retry.type = 'button';
    retry.className = 'load-more-retry-btn';
    retry.textContent = 'Retry';
    retry.onclick = () => loadMoreArticles();
    panel.appendChild(retry);
  } else if (hasMoreArticles()) {
    const status = document.createElement('div');
    status.className = 'load-more-status';
    status.setAttribute('role', 'status');
    status.setAttribute('aria-live', 'polite');
    status.id = 'load-more-status';
    status.textContent = `Showing ${loadedCount} of ${totalArticleCount} articles`;
    panel.appendChild(status);

    const button = document.createElement('button');
    button.type = 'button';
    button.id = 'load-more-button';
    button.className = 'load-more-btn';
    button.setAttribute('aria-describedby', 'load-more-status');
    button.textContent = 'Load more';
    button.onclick = () => loadMoreArticles();
    panel.appendChild(button);
  } else {
    const status = document.createElement('div');
    status.className = 'load-more-status';
    status.setAttribute('role', 'status');
    status.setAttribute('aria-live', 'polite');
    status.textContent = totalArticleCount === 1
      ? 'Showing the only article'
      : `Showing all ${totalArticleCount} articles`;
    panel.appendChild(status);
  }

  region.appendChild(panel);
}

// --- Render --------------------------------------------------------
function render() {
  const grid    = document.getElementById('card-grid');
  const emptyEl = document.getElementById('empty-state');
  const noRes   = document.getElementById('no-results');
  const loadMoreRegion = document.getElementById('load-more-region');
  grid.innerHTML = '';
  emptyEl.style.display = 'none';
  noRes.style.display   = 'none';

  if (showEmpty)    {
    emptyEl.style.display = 'flex';
    loadMoreRegion.innerHTML = '';
    document.getElementById('article-count').textContent = '0 articles';
    syncDetailsPanel();
    return;
  }
  if (showSkeleton) {
    for (let i = 0; i < 5; i++) grid.appendChild(renderSkeleton());
    loadMoreRegion.innerHTML = '';
    document.getElementById('article-count').textContent = '— articles';
    syncDetailsPanel();
    return;
  }

  const filtered = ARTICLES.filter(matchesFilters).sort((a, b) => a.urgency - b.urgency);
  document.getElementById('article-count').textContent = `${filtered.length} article${filtered.length !== 1 ? 's' : ''}`;

  if (filtered.length === 0) {
    if (!isLoadingMore) noRes.style.display = 'flex';
    renderLoadMoreRegion();
    syncDetailsPanel();
    return;
  }
  filtered.forEach(a => grid.appendChild(renderCard(a)));
  renderLoadMoreRegion();
  syncDetailsPanel();
}

function syncDetailsPanel() {
  const panel = document.getElementById('side-panel');
  const content = document.getElementById('panel-content');
  const arrow = document.getElementById('side-strip-arrow');
  if (!selectedId) {
    panel.classList.add('hidden');
    return;
  }

  const article = ARTICLES.find(item => item.id === selectedId);
  if (!article) {
    selectedId = null;
    sessionStorage.removeItem(SELECTED_ARTICLE_KEY);
    panel.classList.add('hidden');
    return;
  }

  panel.classList.remove('hidden');
  if (detailsPanelOpen) {
    panel.style.width = '300px';
    panel.style.flexBasis = '300px';
    content.style.display = 'flex';
    arrow.innerHTML = '<polyline points="9 18 15 12 9 6"/>';
  } else {
    panel.style.width = '12px';
    panel.style.flexBasis = '12px';
    content.style.display = 'none';
    arrow.innerHTML = '<polyline points="15 18 9 12 15 6"/>';
  }
  renderDetailsArticle(article);
}

function renderDetailsArticle(article) {
  document.getElementById('panel-title').textContent = article.title;
  document.getElementById('panel-destinations').innerHTML = ['medium','hashnode','devto'].map(platform => {
    const destination = article.destinations[platform];
    return `<div style="display:flex;align-items:center;justify-content:space-between;">
      <span style="color:#c9cfe0;font-size:12px;">${PLATFORM_LABEL[platform]}</span>
      <div style="display:flex;align-items:center;gap:6px;">
        <span style="width:7px;height:7px;border-radius:50%;background:${DOT_COLOR[destination.status]||'#252a38'};display:inline-block;"></span>
        <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:${DOT_COLOR[destination.status]||'#5a6080'}">${destination.label}</span>
      </div>
    </div>`;
  }).join('');
  document.getElementById('panel-timeline').innerHTML = article.timeline.map(item =>
    `<div style="display:flex;gap:8px;">
      <span style="color:#5a6080;font-family:'JetBrains Mono',monospace;font-size:10px;width:48px;flex-shrink:0;padding-top:1px;">${item.time}</span>
      <span style="color:#c9cfe0;font-size:12px;line-height:1.5;">${item.event}</span>
    </div>`
  ).join('');

  const state = jobLifecycle ? jobLifecycle.state(article.id) : null;
  const busy = jobLifecycle ? jobLifecycle.isBusy(article.id) : false;
  const primary = document.getElementById('panel-primary-btn');
  primary.textContent = article.action.label;
  primary.style.background = article.action.bg;
  primary.style.color = article.action.color;
  primary.style.border = `1px solid ${article.action.border}`;
  primary.disabled = busy;
  primary.onclick = async () => { await runArticleAction(article); };
  const inspect = document.getElementById('panel-inspect-btn');
  inspect.disabled = busy;
  inspect.onclick = async () => { await runArticleAction(article, 'inspect'); };
  renderPanelJobState(article.id, state);
}

function renderPanelJobState(articleId, state) {
  const region = document.getElementById('panel-job-region');
  if (!state) {
    region.hidden = true;
    return;
  }
  const labels = {
    submitting: 'Submitting action', queued: 'Queued', running: 'Running',
    retrying: 'Retrying', canceling: 'Canceling', canceled: 'Canceled',
    failed: 'Action failed', recovering: 'Recovering after reload',
    'recovery-error': 'Recovery unavailable', completed: 'Completed',
  };
  const operation = state.operation
    ? `${state.operation === 'inspect' ? 'Inspection' : 'Push'} operation`
    : '';
  region.hidden = false;
  region.dataset.tone = ['failed', 'canceled'].includes(state.status)
    ? 'error'
    : ['retrying', 'recovering', 'recovery-error', 'canceling'].includes(state.status)
      ? 'warning'
      : state.status === 'completed' ? 'success' : 'default';
  document.getElementById('panel-job-title').textContent = labels[state.status] || state.status;
  document.getElementById('panel-job-meta').textContent = [operation, state.jobId].filter(Boolean).join(' · ');
  const error = document.getElementById('panel-job-error');
  error.style.display = state.error ? 'block' : 'none';
  error.textContent = state.error || '';

  const cancel = document.getElementById('panel-cancel-job-btn');
  const retry = document.getElementById('panel-retry-job-btn');
  const retryRecovery = document.getElementById('panel-retry-recovery-btn');
  cancel.style.display = ['queued', 'running', 'retrying'].includes(state.status) ? 'inline-flex' : 'none';
  retry.style.display = ['failed', 'canceled'].includes(state.status) && state.retryable ? 'inline-flex' : 'none';
  retryRecovery.style.display = state.status === 'recovery-error' ? 'inline-flex' : 'none';
  cancel.onclick = () => jobLifecycle.cancel(articleId);
  retry.onclick = () => jobLifecycle.retry(articleId);
  retryRecovery.onclick = () => jobLifecycle.retryRecovery(articleId);
  document.getElementById('panel-job-actions').style.display =
    [cancel, retry, retryRecovery].some(button => button.style.display !== 'none') ? 'flex' : 'none';
}

// --- Interactions --------------------------------------------------
function selectCard(id) {
  closeMenus();
  if (id === selectedId) {
    detailsPanelOpen = !detailsPanelOpen;
    syncDetailsPanel();
    return;
  }
  selectedId = id;
  detailsPanelOpen = true;
  sessionStorage.setItem(SELECTED_ARTICLE_KEY, id);
  render();
  void jobLifecycle.recover(id);
}

function toggleDetailsPanel() {
  if (!selectedId) return;
  detailsPanelOpen = !detailsPanelOpen;
  syncDetailsPanel();
}

function closePanel() {
  selectedId = null;
  sessionStorage.removeItem(SELECTED_ARTICLE_KEY);
  detailsPanelOpen = true;
  render();
  syncDetailsPanel();
}

function setStatusFilter(val, el) {
  statusFilter = val;
  document.querySelectorAll('.pill-filter').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  applyFilters();
}

function togglePlatform(p, el) {
  platformFilter.has(p) ? platformFilter.delete(p) : platformFilter.add(p);
  el.classList.toggle('active');
  applyFilters();
}

function applyFilters() {
  invalidateInFlightPageLoad();
  render();
  void loadRemainingArticlesForFilters();
}

function clearFilters() {
  document.getElementById('search-input').value = '';
  statusFilter = 'all';
  platformFilter.clear();
  document.querySelectorAll('.pill-filter').forEach(b => b.classList.remove('active'));
  document.getElementById('sf-all').classList.add('active');
  document.querySelectorAll('.pill-platform').forEach(b => b.classList.remove('active'));
  invalidateInFlightPageLoad();
  render();
}

function toggleSkeleton() { showSkeleton = !showSkeleton; showEmpty = false; render(); }
function toggleEmpty()    { showEmpty = !showEmpty; showSkeleton = false; render(); }

function toggleImportMenu(e) {
  e.stopPropagation();
  const menu = document.getElementById('import-menu');
  const isOpen = menu.style.display === 'block';
  menu.style.display = isOpen ? 'none' : 'block';
  if (!isOpen) {
    const close = () => { menu.style.display = 'none'; document.removeEventListener('click', close); };
    document.addEventListener('click', close);
  }
}

function setView(v) {
  document.querySelectorAll('.nav-tab').forEach(t => {
    t.style.borderBottomColor = 'transparent';
    t.style.color = '#5a6080';
    t.style.fontWeight = '400';
  });
  const el = document.getElementById('nav-' + v);
  if (el) { el.style.borderBottomColor = '#6366f1'; el.style.color = '#e8eaf2'; el.style.fontWeight = '500'; }
}

function toggleMenu(id, wrap) {
  if (openMenuId === id) { closeMenus(); return; }
  closeMenus();
  openMenuId = id;
  const menu = document.createElement('div');
  menu.className = 'ctx-menu';
  menu.innerHTML = `
    <button class="ctx-item" onclick="alert('Edit ${id}');closeMenus()">Edit</button>
    <button class="ctx-item" onclick="alert('Duplicate ${id}');closeMenus()">Duplicate</button>
    <button class="ctx-item" onclick="alert('Archive ${id}');closeMenus()">Archive</button>
    <button class="ctx-item danger" onclick="alert('Delete ${id}');closeMenus()">Delete</button>`;
  wrap.appendChild(menu);
  setTimeout(() => document.addEventListener('click', closeMenus, { once: true }), 0);
}

function closeMenus() {
  document.querySelectorAll('.ctx-menu').forEach(m => m.remove());
  openMenuId = null;
}

jobLifecycle = new OverviewJobLifecycle({
  request: fetchJson,
  storage: sessionStorage,
  onChange: () => render(),
  onCompleted: async () => {
    await loadOverview();
    render();
  },
});

showSkeleton = true;
render();
loadOverview()
  .then(() => {
    const restoredId = sessionStorage.getItem(SELECTED_ARTICLE_KEY);
    if (restoredId && ARTICLES.some(article => article.id === restoredId)) {
      selectedId = restoredId;
      detailsPanelOpen = true;
    }
  })
  .catch(error => { alert(`Failed to load overview: ${error.message}`); })
  .finally(() => {
    showSkeleton = false;
    render();
    if (selectedId) void jobLifecycle.recover(selectedId);
  });
</script>
